  Title of the event; must not be blank.
  """
  title: String!

  """
  Notes attached to the event.
  """
  notes: String

  """
  Location as text. Replaces any stored coordinates. Mutually exclusive with structuredLocation.
  """
  location: String

  """
  Location with coordinates, as from a location search. Mutually exclusive with location.
  """
  structuredLocation: StructuredLocationInput

  """
  Absolute URL attached to the event.
  """
  url: URL

  """
  Start of a timed event. On a patch, a new start alone moves the event and keeps its length.
  """
  startDate: DateTime

  """
  End of a timed event; must not precede the start. On a patch, a new end alone resizes the event.
  """
  endDate: DateTime

  """
  First day of an all-day event, in the host zone. On a patch, a new start alone moves the event and keeps its length in days. Do not combine with startDate or endDate.
  """
  allDayStartDate: LocalDate

  """
  Last day of an all-day event, inclusive; defaults to the start day on creation.
  """
  allDayEndDate: LocalDate

  """
  IANA time zone a timed event is anchored to; it does not move the event's instants. New timed events default to the host zone. Not allowed for all-day events.
  """
  timeZone: String

  """
  How the event shows on a free/busy schedule; must be one of the calendar's supportedAvailabilities.
  """
  availability: EventAvailability

  """
  Replace all alerts; [] removes them. Each needs exactly one of absoluteDate or relativeOffsetSeconds.
  """
  alarms: [EventAlarmInput!]

  """
  Make the event repeat on one schedule, replacing any stored rules. On a repeating event this needs FUTURE_EVENTS or the series id.
  """
  recurrence: RecurrenceRuleInput
}

input StructuredLocationInput {
  """
  Display name of the place; must not be blank.
  """
  title: String!

  """
  Latitude in degrees, between -90 and 90.
  """
  latitude: Float!

  """
  Longitude in degrees, between -180 and 180.
  """
  longitude: Float!

  """
  Radius in meters; zero or omitted requests the system default.
  """
  radiusMeters: Float
}

input EventAlarmInput {
  """
  Alert at this date and time.
  """
  absoluteDate: DateTime

  """
  Alert this many seconds from the event's start: negative before, zero at, positive after.
  """
  relativeOffsetSeconds: Float

  """
  System sound to play. The provider may not keep it; a WRITE_APPLIED error reports that.
  """
  soundName: String

  """
  Address to email. The provider may not keep it; a WRITE_APPLIED error reports that.
  """
  emailAddress: String
}

input RecurrenceRuleInput {
  """
  The unit of repetition.
  """
  frequency: RecurrenceFrequency!

  """
  Positive number of frequency units between occurrences.
  """
  interval: Int!

  """
  Weekday constraints. Null means unconstrained. Not allowed for daily rules.
  """
  daysOfWeek: [RecurrenceDayInput!]

  """
  Weekday phrases such as tuesday or second tuesday, ignoring case. Ordinals: first through fifth and last through fifth-to-last. Mutually exclusive with daysOfWeek.
  """
  daysOfWeekNames: [String!]

  """
  Days 1..31 or -31..-1 counting backward from the end of the month. Monthly rules only.
  """
  daysOfMonth: [Int!]

  """
  Months 1..12. Yearly rules only.
  """
  monthsOfYear: [Int!]

  """
  Week numbers 1..53 or -53..-1 counting backward from year end. Yearly rules only.
  """
  weeksOfYear: [Int!]

  """
  Year days 1..366 or -366..-1 counting backward from year end. Yearly rules only.
  """
  daysOfYear: [Int!]

  """
  Select positions 1..366 or -366..-1 from occurrences matching the other constraints in each period. Requires another selector.
  """
  setPositions: [Int!]

  """
  When repetition stops; null means no specified end.
  """
  end: RecurrenceEndInput
}

input RecurrenceDayInput {
  """
  The weekday to match.
  """
  day: Weekday!

  """
  Occurrence of this weekday: 1 is first, -1 last; omit for every occurrence. Valid range -53..53 excluding zero; non-null ordinals require monthly or yearly frequency.
  """
  ordinal: Int
}

input RecurrenceEndInput {
  """
  Inclusive end timestamp; mutually exclusive with count.
  """
  until: DateTime

  """
  Positive number of occurrences; mutually exclusive with until.
  """
  count: Int
}

enum EventSpan {
